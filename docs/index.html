<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 Hacking Academy LATAM</title>
<meta name="description" content="Aprende hacking ético como un videojuego en español">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<style>
/* ============================================================
   🎓 HACKING ACADEMY LATAM - Styles v2.0
   ============================================================ */

:root {
    --bg: #0a0a0f;
    --bg-card: #111118;
    --bg-card2: #16161f;
    --border: #222233;
    --text: #e0e0e0;
    --text-dim: #888;
    --accent: #00ff88;
    --accent2: #00aaff;
    --purple: #8a2be2;
    --red: #ff4444;
    --orange: #ff8c00;
    --yellow: #ffbd2e;
    --sidebar-w: 260px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 15px; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

/* ==================== AUTH ==================== */
.auth-page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #0a0a0f, #0f1a0a, #0a0f1a);
}
.auth-page .matrix-bg { position: absolute; inset: 0; opacity: 0.15; }
.auth-page canvas { width: 100%; height: 100%; }
.auth-card {
    position: relative; z-index: 2;
    background: rgba(17, 17, 24, 0.95);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3rem 2.5rem;
    width: 420px;
    max-width: 95vw;
    text-align: center;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.auth-logo { font-size: 4rem; margin-bottom: 0.5rem; }
.auth-card h1 { font-size: 1.8rem; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.3rem; }
.auth-subtitle { font-size: 1.5rem; color: var(--purple); font-weight: bold; margin-bottom: 0.5rem; letter-spacing: 8px; }
.auth-desc { color: var(--text-dim); margin-bottom: 2rem; }
.auth-input {
    width: 100%; padding: 0.9rem 1.2rem;
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 1rem; margin-bottom: 1rem; outline: none;
    transition: border-color 0.3s;
}
.auth-input:focus { border-color: var(--accent); }
.auth-switch { color: var(--text-dim); margin-top: 1.5rem; font-size: 0.9rem; }
.auth-switch a { color: var(--accent); cursor: pointer; text-decoration: underline; }
.auth-demo { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
.auth-demo p { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 0.5rem; }

/* ==================== BUTTONS ==================== */
.btn {
    display: inline-block; padding: 0.7rem 1.5rem; border-radius: 10px; border: none;
    font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.3s;
    text-decoration: none; text-align: center;
}
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,255,136,0.3); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-full { width: 100%; }
.btn-sm { padding: 0.5rem 1rem; font-size: 0.85rem; }

/* ==================== LAYOUT ==================== */
.layout { display: flex; min-height: 100vh; }

/* ==================== SIDEBAR ==================== */
.sidebar {
    width: var(--sidebar-w); background: var(--bg-card); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0;
    z-index: 100;
}
.sidebar-logo { padding: 1.5rem; display: flex; align-items: center; gap: 0.8rem; border-bottom: 1px solid var(--border); }
.logo-icon { font-size: 2rem; }
.logo-text { font-size: 1rem; font-weight: bold; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.nav-user { padding: 1.2rem; border-bottom: 1px solid var(--border); text-align: center; }
.nav-avatar { font-size: 2.5rem; }
.nav-username { font-weight: bold; font-size: 1.05rem; }
.nav-level { color: var(--accent); font-size: 0.85rem; }
.nav-xp-bar { background: var(--bg); border-radius: 10px; height: 8px; margin-top: 0.6rem; overflow: hidden; }
.nav-xp-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 10px; transition: width 0.5s; }
.nav-links { flex: 1; padding: 0.8rem 0; overflow-y: auto; }
.nav-link {
    display: flex; align-items: center; gap: 0.8rem; padding: 0.75rem 1.2rem;
    color: var(--text-dim); cursor: pointer; transition: all 0.2s; font-size: 0.95rem;
    border-left: 3px solid transparent;
}
.nav-link:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.nav-link.active { color: var(--accent); background: rgba(0,255,136,0.05); border-left-color: var(--accent); }
.nav-icon { font-size: 1.2rem; width: 28px; text-align: center; }
.nav-footer { padding: 0.8rem 0; border-top: 1px solid var(--border); }

/* ==================== MAIN CONTENT ==================== */
.main-content { flex: 1; margin-left: var(--sidebar-w); padding: 2rem; max-width: 1400px; }
.page-header { margin-bottom: 2rem; }
.page-header h1 { font-size: 2rem; }
.page-sub { color: var(--text-dim); margin-top: 0.3rem; }
.back-btn { color: var(--accent); cursor: pointer; font-size: 0.9rem; margin-bottom: 0.5rem; display: inline-block; }
.back-btn:hover { text-decoration: underline; }

/* ==================== STATS GRID ==================== */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
.stat-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.5rem; text-align: center; transition: transform 0.3s;
}
.stat-card:hover { transform: translateY(-3px); }
.stat-card.accent { border-color: var(--accent); background: linear-gradient(135deg, rgba(0,255,136,0.05), rgba(0,170,255,0.05)); }
.stat-icon { font-size: 2rem; margin-bottom: 0.5rem; }
.stat-value { font-size: 1.8rem; font-weight: bold; }
.stat-label { color: var(--text-dim); font-size: 0.85rem; margin-top: 0.3rem; }
.xp-bar { background: var(--bg); border-radius: 10px; height: 10px; margin-top: 0.8rem; overflow: hidden; }
.xp-bar.large { height: 14px; }
.xp-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 10px; transition: width 0.5s; }
.xp-text { font-size: 0.8rem; color: var(--text-dim); margin-top: 0.3rem; }

/* ==================== CARDS ==================== */
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 1.5rem; }
.card-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); }
.card-header h3 { font-size: 1.05rem; }
.card-body { padding: 1rem 1.5rem; }
.empty { color: var(--text-dim); text-align: center; padding: 2rem; }

/* ==================== DASHBOARD ==================== */
.dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
@media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }

.mission-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 0; border-bottom: 1px solid var(--border); }
.mission-item:last-child { border-bottom: none; }
.mission-title { font-weight: 600; }
.mission-desc { color: var(--text-dim); font-size: 0.85rem; }
.mission-xp { color: var(--accent); font-weight: bold; }

.course-mini { display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 0; cursor: pointer; border-bottom: 1px solid var(--border); }
.course-mini:last-child { border-bottom: none; }
.course-mini:hover { color: var(--accent); }
.course-mini-icon { font-size: 1.5rem; }
.course-mini-title { font-weight: 600; font-size: 0.9rem; }
.course-mini-diff { color: var(--text-dim); font-size: 0.8rem; }

/* ==================== LEADERBOARD ==================== */
.leaderboard-item { display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
.leaderboard-item:last-child { border-bottom: none; }
.lb-rank { font-weight: bold; min-width: 35px; }
.lb-avatar { font-size: 1.3rem; }
.lb-name { font-weight: 600; flex: 1; }
.lb-country { font-size: 1.2rem; }
.lb-level { color: var(--accent); font-weight: bold; }
.lb-xp { color: var(--yellow); font-size: 0.85rem; }

/* ==================== COURSES ==================== */
.filter-bar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.filter-btn { padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-dim); cursor: pointer; transition: all 0.2s; font-size: 0.85rem; }
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

.courses-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
.course-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.8rem; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden;
}
.course-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,255,136,0.1); }
.course-icon { font-size: 3rem; margin-bottom: 0.8rem; }
.course-badge { position: absolute; top: 1rem; right: 1rem; padding: 0.2rem 0.7rem; border-radius: 20px; font-size: 0.7rem; font-weight: bold; color: #000; text-transform: uppercase; }
.course-card h3 { font-size: 1.15rem; margin-bottom: 0.5rem; }
.course-card p { color: var(--text-dim); font-size: 0.85rem; line-height: 1.5; margin-bottom: 1rem; }
.course-meta { display: flex; gap: 1rem; color: var(--text-dim); font-size: 0.8rem; margin-bottom: 1rem; }
.course-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; border-top: 1px solid var(--border); }
.course-xp { color: var(--accent); font-weight: bold; }
.course-price { font-weight: bold; }

/* ==================== COURSE DETAIL ==================== */
.detail-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; }
@media (max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
.detail-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 1.5rem; }
.detail-stat { background: var(--bg-card); padding: 1rem; border-radius: 10px; text-align: center; border: 1px solid var(--border); }
.detail-stat span { display: block; }
.detail-stat span:first-child { font-size: 1.5rem; }
.detail-stat span:last-child { font-size: 0.85rem; color: var(--text-dim); margin-top: 0.3rem; }
.enrolled-badge { background: rgba(0,255,136,0.1); border: 1px solid var(--accent); color: var(--accent); padding: 0.8rem; border-radius: 10px; text-align: center; margin-bottom: 1.5rem; }
.module-item { display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 0; border-bottom: 1px solid var(--border); }
.module-item:last-child { border-bottom: none; }
.module-item.clickable { cursor: pointer; }
.module-item.clickable:hover { color: var(--accent); }
.module-num { width: 28px; height: 28px; background: var(--bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; flex-shrink: 0; }
.module-title { flex: 1; }
.module-xp { color: var(--accent); font-size: 0.85rem; }

.lab-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.lab-item:last-child { border-bottom: none; }
.lab-item:hover { color: var(--accent); }
.lab-meta { color: var(--text-dim); font-size: 0.8rem; }
.lab-arrow { color: var(--accent); }
.reward-item { display: flex; justify-content: space-between; padding: 0.5rem 0; }
.xp-total { color: var(--accent); font-weight: bold; }

/* ==================== LABS ==================== */
.labs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
.lab-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.5rem; cursor: pointer; transition: all 0.3s;
}
.lab-card:hover { transform: translateY(-3px); border-color: var(--accent); }
.lab-card.completed { border-color: rgba(0,255,136,0.3); opacity: 0.8; }
.lab-card-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
.lab-diff { font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
.lab-done { font-size: 1.2rem; }
.lab-card h3 { font-size: 1.05rem; margin-bottom: 0.3rem; }
.lab-card p { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 1rem; }
.lab-card-footer { display: flex; gap: 0.8rem; font-size: 0.8rem; }
.lab-cat { color: var(--text-dim); text-transform: uppercase; }
.lab-xp { color: var(--accent); font-weight: bold; }
.lab-badge { color: var(--yellow); }

/* ==================== LAB TERMINAL ==================== */
.lab-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 1.5rem; }
@media (max-width: 1000px) { .lab-layout { grid-template-columns: 1fr; } }
.lab-hints { margin-top: 1.5rem; }
.lab-hints h4 { margin-bottom: 0.5rem; }
.hint { padding: 0.5rem; margin-bottom: 0.5rem; background: var(--bg); border-radius: 8px; cursor: pointer; border: 1px solid var(--border); }
.hint-lock { display: block; }
.hint-text { display: none; color: var(--accent); }
.hint.revealed .hint-lock { display: none; }
.hint.revealed .hint-text { display: block; }
.flag-submit { display: flex; gap: 0.5rem; margin-top: 1.5rem; }
.flag-input { flex: 1; padding: 0.8rem; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 0.95rem; outline: none; }
.flag-input:focus { border-color: var(--accent); }
.flag-success { background: rgba(0,255,136,0.1); border: 1px solid var(--accent); color: var(--accent); padding: 1rem; border-radius: 10px; margin-top: 1rem; text-align: center; }
.flag-error { background: rgba(255,68,68,0.1); border: 1px solid var(--red); color: var(--red); padding: 1rem; border-radius: 10px; margin-top: 1rem; text-align: center; }

.lab-terminal-wrap {
    background: #0d0d0d; border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
}
.terminal-header { background: #1a1a2e; padding: 0.7rem 1rem; display: flex; align-items: center; gap: 0.8rem; border-bottom: 1px solid #333; }
.terminal-dots { display: flex; gap: 0.4rem; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot.red { background: #ff5f56; }
.dot.yellow { background: #ffbd2e; }
.dot.green { background: #27ca40; }
.terminal-title { color: var(--text-dim); font-size: 0.8rem; font-family: 'Courier New', monospace; }
.terminal-body {
    padding: 1rem; font-family: 'Courier New', monospace; font-size: 0.85rem;
    height: 400px; overflow-y: auto; line-height: 1.6;
}
.terminal-line { white-space: pre-wrap; word-break: break-all; }
.terminal-line .prompt { color: var(--accent); }
.terminal-line .command { color: #fff; }
.terminal-line .output { color: var(--text-dim); }
.terminal-line .system { color: var(--text-dim); }
.terminal-line .success { color: var(--accent); }
.terminal-line .warning { color: var(--yellow); }
.terminal-line .error { color: var(--red); }
.cursor { animation: blink 1s infinite; color: var(--accent); }
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
.terminal-input-wrap { display: flex; align-items: center; padding: 0.5rem 1rem; border-top: 1px solid #333; background: #0a0a0a; }
.terminal-input { flex: 1; background: transparent; border: none; color: var(--text); font-family: 'Courier New', monospace; font-size: 0.9rem; outline: none; }

/* ==================== MISSIONS ==================== */
.missions-section { margin-bottom: 3rem; }
.missions-section h2 { font-size: 1.5rem; margin-bottom: 0.3rem; }
.section-sub { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 1.5rem; }
.missions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
.mission-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.5rem; transition: transform 0.3s;
}
.mission-card:hover { transform: translateY(-3px); }
.mission-card.daily { border-left: 3px solid var(--accent2); }
.mission-card.weekly { border-left: 3px solid var(--purple); }
.mission-header { display: flex; justify-content: space-between; margin-bottom: 0.8rem; }
.mission-type { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; color: var(--text-dim); letter-spacing: 2px; }
.mission-xp-badge { background: rgba(0,255,136,0.15); color: var(--accent); padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
.mission-card h3 { font-size: 1.05rem; margin-bottom: 0.3rem; }
.mission-card p { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 0.8rem; }
.mission-cat { color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; }
.mission-progress { margin-top: 0.5rem; }
.mission-progress-bar { background: var(--bg); border-radius: 10px; height: 8px; overflow: hidden; margin-bottom: 0.3rem; }
.mission-progress-fill { height: 100%; background: linear-gradient(90deg, var(--purple), var(--accent2)); border-radius: 10px; }
.mission-progress span { font-size: 0.8rem; color: var(--text-dim); }

/* ==================== LEADERBOARD FULL ==================== */
.leaderboard-full { max-width: 900px; }
.lb-row {
    display: flex; align-items: center; gap: 1rem; padding: 0.8rem 1.2rem;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 0.5rem; transition: transform 0.2s;
}
.lb-row:hover { transform: translateX(5px); }
.lb-row.lb-user { border-color: var(--accent); background: rgba(0,255,136,0.05); }
.lb-row.lb-top3 { background: rgba(255,140,0,0.05); }
.lb-rank-full { font-weight: bold; min-width: 40px; font-size: 1.1rem; }
.lb-avatar-full { font-size: 1.8rem; }
.lb-info { flex: 1; }
.lb-name-full { font-weight: 600; }
.lb-you { background: var(--accent); color: #000; padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.7rem; margin-left: 0.5rem; }
.lb-title { color: var(--text-dim); font-size: 0.8rem; }
.lb-country-full { font-size: 1.5rem; }
.lb-stats-full { display: flex; gap: 1rem; align-items: center; }
.lb-level-full { color: var(--accent); font-weight: bold; }
.lb-xp-full { color: var(--yellow); font-size: 0.85rem; }
.lb-labs-full { color: var(--text-dim); font-size: 0.85rem; }

/* ==================== BADGES ==================== */
.badges-progress { margin-bottom: 2rem; }
.badges-bar { background: var(--bg-card); border-radius: 10px; height: 12px; overflow: hidden; }
.badges-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple), var(--orange)); border-radius: 10px; }
.badges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
.badge-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.5rem; text-align: center; transition: all 0.3s;
}
.badge-card:hover { transform: translateY(-3px); }
.badge-card.unlocked { border-color: var(--rarity-color, var(--accent)); box-shadow: 0 0 15px rgba(0,255,136,0.1); }
.badge-card.locked { opacity: 0.4; filter: grayscale(1); }
.badge-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
.badge-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.3rem; }
.badge-rarity { font-size: 0.7rem; font-weight: bold; letter-spacing: 1px; margin-bottom: 0.3rem; }
.badge-desc { color: var(--text-dim); font-size: 0.75rem; margin-bottom: 0.3rem; }
.badge-xp { color: var(--accent); font-size: 0.8rem; }

/* ==================== PROFILE ==================== */
.profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
@media (max-width: 800px) { .profile-grid { grid-template-columns: 1fr; } }
.profile-card { text-align: center; padding: 2rem; }
.profile-avatar { font-size: 4rem; margin-bottom: 0.5rem; }
.profile-title { color: var(--accent); font-size: 1.1rem; font-weight: bold; margin: 0.5rem 0 0.3rem; }
.profile-level { color: var(--text-dim); margin-bottom: 1rem; }
.profile-meta { display: flex; flex-direction: column; gap: 0.3rem; margin-top: 1rem; color: var(--text-dim); font-size: 0.85rem; }
.profile-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.pstat { text-align: center; }
.pstat-val { display: block; font-size: 1.8rem; font-weight: bold; color: var(--accent); }
.pstat-label { color: var(--text-dim); font-size: 0.8rem; }
.badges-mini { display: flex; gap: 0.5rem; flex-wrap: wrap; }

/* ==================== TOAST ==================== */
#toasts { position: fixed; top: 1rem; right: 1rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; }
.toast {
    padding: 0.8rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600;
    transform: translateX(120%); transition: transform 0.3s;
    backdrop-filter: blur(10px); max-width: 400px;
}
.toast.show { transform: translateX(0); }
.toast-success { background: rgba(0,255,136,0.9); color: #000; }
.toast-levelup { background: rgba(138,43,226,0.9); color: #fff; }

.toast-info { background: rgba(0,170,255,0.9); color: #000; }

/* ==================== SCROLLBAR ==================== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ==================== RESPONSIVE ==================== */
@media (max-width: 768px) {
    .sidebar { width: 60px; }
    .sidebar-logo .logo-text, .nav-user-info, .nav-link span:not(.nav-icon) { display: none; }

    .detail-grid { grid-template-columns: 1fr; }
    .lab-layout { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
}

// ==================== AUTH ====================

function getStoredUser() {
    const d = localStorage.getItem("ha_user");
    return d ? JSON.parse(d) : null;
}

function saveUser(u) {
    localStorage.setItem("ha_user", JSON.stringify(u));
}

function loginUser(username, password) {
    // Demo login
    const u = {
        id: "user_" + Date.now(), username, email: username + "@academy.com",
        level: 1, xp: 0, xpNext: 100, title: "Novato", avatar: "😎",
        country: "mx", streak: 0, joined: new Date().toISOString().split("T")[0],
        enrolled: [], completed: [], labs: [], badges: ["B001"], missions: [],
    };
    STATE.user = u;
    saveUser(u);
    return u;
}

function registerUser(username, email, password) {
    return loginUser(username, password);
}

function logout() {
    STATE.user = null;
    localStorage.removeItem("ha_user");
    navigate("login");
}

function addXP(amount) {
    if (!STATE.user) return;
    STATE.user.xp += amount;
    let gained = 0;
    while (STATE.user.xp >= STATE.user.xpNext) {
        STATE.user.xp -= STATE.user.xpNext;
        STATE.user.level++;
        STATE.user.xpNext = STATE.user.level * 100;
        gained++;
    }
    // Update title
    let title = "Novato";
    for (const [lvl, t, _] of RANKS) {
        if (STATE.user.level >= lvl) title = t;
    }
    STATE.user.title = title;
    saveUser(STATE.user);
    if (gained > 0) showToast(`¡Subiste ${gained} nivel${gained>1?'es':''}! Ahora eres ${title}`, "levelup");
    return { gained, title };
}

function completeLab(labId) {
    if (!STATE.user || STATE.user.labs.includes(labId)) return false;
    STATE.user.labs.push(labId);
    const lab = LABS.find(l => l.id === labId);
    if (lab) {
        addXP(lab.xp);
        if (lab.badge && !STATE.user.badges.includes(lab.badge)) {
            STATE.user.badges.push(lab.badge);
            const badge = BADGES_DATA.find(b => b.id === lab.badge);
            showToast(`¡Badge desbloqueado: ${badge.icon} ${badge.name}!`, "badge");
        }
    }
    saveUser(STATE.user);
    return true;
}

function enrollInCourse(courseId) {
    if (!STATE.user) return false;
    if (!STATE.user.enrolled.includes(courseId)) {
        STATE.user.enrolled.push(courseId);
        saveUser(STATE.user);
    }
    return true;
}

// ==================== NAVIGATION ====================

function navigate(page, data = null) {
    STATE.pageHistory.push(STATE.currentPage);
    STATE.currentPage = page;
    if (data) {
        if (data.course) STATE.selectedCourse = data.course;
        if (data.lab) STATE.selectedLab = data.lab;
    }
    render();
}

function goBack() {
    if (STATE.pageHistory.length > 0) {
        STATE.currentPage = STATE.pageHistory.pop();
        render();
    }
}

function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function showToast(msg, type = "info") {
    const toast = document.createElement("div");
    toast.className = `toast toast-${type}`;
    toast.innerHTML = msg;
    document.getElementById("toasts").appendChild(toast);
    setTimeout(() => toast.classList.add("show"), 10);
    setTimeout(() => { toast.classList.remove("show"); setTimeout(() => toast.remove(), 300); }, 3000);
}

// ==================== MATRIX BACKGROUND ====================

function initMatrix() {
    const canvas = document.getElementById("matrix-canvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF";
    const fontSize = 14;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = new Array(columns).fill(1);

    function draw() {
        ctx.fillStyle = "rgba(10, 10, 15, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#00ff8830";
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(draw, 50);
}

                    <div class="terminal-line"><span class="prompt">${lab.terminal.prompt}</span> <span class="cursor">█</span></div>
                </div>
                <div class="terminal-input-wrap">
                    <span class="prompt">${lab.terminal.prompt}</span>
                    <input type="text" id="terminal-input" class="terminal-input" onkeydown="if(event.key==='Enter')terminalExec()" autofocus>
                </div>
            </div>
        </div>
    </main></div>`;

    setTimeout(() => {
        const input = document.getElementById("terminal-input");
        if (input) input.focus();
    }, 100);
}

function terminalExec() {
    const input = document.getElementById("terminal-input");
    const body = document.getElementById("terminal-body");
    const cmd = input.value.trim();
    if (!cmd) return;

    const lab = LABS.find(l => l.id === STATE.selectedLab);
    const line = document.createElement("div");
    line.className = "terminal-line";
    line.innerHTML = `<span class="prompt">${escapeHtml(lab.terminal.prompt)}</span> <span class="command">${escapeHtml(cmd)}</span>`;
    body.insertBefore(line, body.lastElementChild);
    input.value = "";

    // Process commands
    const output = document.createElement("div");
    output.className = "terminal-line";

    if (cmd.toLowerCase() === "help") {
        output.innerHTML = `<span class="output">Comandos: help, ls, cat, whoami, id, curl, sqlmap, nmap, find, echo, clear, hint, flag</span>`;
    } else if (cmd.toLowerCase() === "clear") {
        body.innerHTML = `<div class="terminal-line"><span class="prompt">${lab.terminal.prompt}</span> <span class="cursor">█</span></div>`;
        return;
    } else if (cmd.toLowerCase() === "hint") {
        const hint = lab.hints[Math.floor(Math.random() * lab.hints.length)];
        output.innerHTML = `<span class="warning">💡 Pista: ${hint}</span>`;
    } else if (cmd.toLowerCase() === "flag") {
        output.innerHTML = `<span class="system">💡 Ingresa la flag en el formulario de la izquierda</span>`;
    } else if (cmd.toLowerCase().includes("cat /etc/passwd")) {
        output.innerHTML = `<span class="output">root:x:0:0:root:/root:/bin/bash\nwww-data:x:33:33:www-data:/var/www:/usr/sbin/nologin</span>`;
    } else if (cmd.toLowerCase().includes("whoami")) {
        output.innerHTML = `<span class="success">www-data</span>`;
    } else if (cmd.toLowerCase().includes("id")) {
        output.innerHTML = `<span class="output">uid=33(www-data) gid=33(www-data) groups=33(www-data)</span>`;
    } else if (cmd.toLowerCase().includes("ls")) {
        output.innerHTML = `<span class="output">index.php  config.php  uploads/  .htaccess  backup.sql</span>`;
    } else {
        output.innerHTML = `<span class="output">bash: ${cmd.split(' ')[0]}: command processed...</span>`;
    }

    body.insertBefore(output, body.lastElementChild);
    body.scrollTop = body.scrollHeight;
}

function submitFlag(labId) {
    const input = document.getElementById("flag-input");
    const result = document.getElementById("flag-result");
    const lab = LABS.find(l => l.id === labId);
    if (!lab) return;

    if (input.value.trim() === lab.flag) {
        completeLab(labId);
        result.innerHTML = `<div class="flag-success">🎉 ¡FLAG CORRECTA! +${lab.xp} XP ganados. ¡Excelente trabajo, hacker!</div>`;
        showToast(`¡Lab completado! +${lab.xp} XP 🎉`, "success");
    } else {
        result.innerHTML = `<div class="flag-error">❌ Flag incorrecta. Intenta de nuevo o usa las pistas.</div>`;
    }
}
